<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HayDev Marketing — WebGL Logo</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}
    #app{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);font:500 12px/1.2 system-ui,sans-serif;letter-spacing:.18em;color:rgba(210,230,255,.55);text-transform:uppercase;pointer-events:none}
  </style>
</head>
<body>
<div id="app"></div>
<div class="hint">Move pointer • WebGL parallax</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const app = document.querySelector('#app');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0,8.8);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
app.appendChild(renderer.domElement);

const root = new THREE.Group();
scene.add(root);

// Star field / particles
const pCount = 240;
const pos = new Float32Array(pCount*3);
for(let i=0;i<pCount;i++){
  const r = 4 + Math.random()*6;
  const a = Math.random()*Math.PI*2;
  const b = (Math.random()-.5)*Math.PI;
  pos[i*3] = Math.cos(a)*Math.cos(b)*r;
  pos[i*3+1] = Math.sin(b)*r*.55;
  pos[i*3+2] = -1 - Math.random()*5;
}
const pg = new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pm = new THREE.PointsMaterial({size:.025, color:0x72d7ff, transparent:true, opacity:.55, depthWrite:false, blending:THREE.AdditiveBlending});
const points = new THREE.Points(pg,pm); scene.add(points);

const loader = new THREE.TextureLoader();
const logoTex = await loader.loadAsync('./haydev-marketing-logo.png');
logoTex.colorSpace = THREE.SRGBColorSpace;
logoTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const aspect = logoTex.image.width/logoTex.image.height;
const H = 6.0;
const W = H*aspect;
const geo = new THREE.PlaneGeometry(W,H,1,1);

// Faux 3D extrusion layers from a raster logo
const layers = [
  {z:-0.16, scale:0.998, opacity:.28, color:0x09111f},
  {z:-0.10, scale:0.999, opacity:.35, color:0x12284b},
  {z:-0.05, scale:1.000, opacity:.42, color:0x204a92},
  {z: 0.00, scale:1.000, opacity:1.00, color:0xffffff},
];
for(const L of layers){
  const mat = new THREE.MeshBasicMaterial({map:logoTex,transparent:true,alphaTest:.02,opacity:L.opacity,color:L.color,depthWrite:false});
  const m = new THREE.Mesh(geo,mat); m.position.z=L.z; m.scale.setScalar(L.scale); root.add(m);
}

// Soft halo behind the logo
const haloCanvas = document.createElement('canvas'); haloCanvas.width=haloCanvas.height=512;
const ctx = haloCanvas.getContext('2d');
const g = ctx.createRadialGradient(256,256,0,256,256,256);
g.addColorStop(0,'rgba(0,196,255,.40)'); g.addColorStop(.32,'rgba(76,0,255,.22)'); g.addColorStop(.62,'rgba(255,0,213,.10)'); g.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=g; ctx.fillRect(0,0,512,512);
const haloTex = new THREE.CanvasTexture(haloCanvas);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
halo.position.z=-.7; halo.scale.set(8.0,8.0,1); root.add(halo);

// Orbit rings for stronger 3D motion
const ringMat1 = new THREE.MeshBasicMaterial({color:0x25c8ff,transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending});
const ringMat2 = ringMat1.clone(); ringMat2.color.set(0xc248ff); ringMat2.opacity=.13;
const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.55,.012,8,180), ringMat1); ring1.rotation.x=1.08; ring1.rotation.z=.35; ring1.position.z=-.35; root.add(ring1);
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.82,.009,8,180), ringMat2); ring2.rotation.x=.82; ring2.rotation.z=-.55; ring2.position.z=-.55; root.add(ring2);

let tx=0, ty=0, px=0, py=0;
function onPointer(e){
  const x = (e.clientX/innerWidth)*2-1;
  const y = (e.clientY/innerHeight)*2-1;
  tx = y*.12; ty = x*.18;
  px = x; py = y;
}
addEventListener('pointermove',onPointer,{passive:true});
addEventListener('pointerleave',()=>{tx=ty=px=py=0});

const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();
  root.rotation.x += (tx-root.rotation.x)*.045;
  root.rotation.y += (ty-root.rotation.y)*.045;
  root.rotation.z = Math.sin(t*.45)*.018;
  root.position.y = Math.sin(t*.85)*.10;
  root.position.x = Math.cos(t*.62)*.045;
  const breathe = 1 + Math.sin(t*1.25)*.012;
  root.scale.setScalar(breathe);

  halo.material.opacity = .72 + Math.sin(t*1.7)*.11;
  ring1.rotation.z += .0024; ring2.rotation.z -= .0017;
  ring1.rotation.y = Math.sin(t*.5)*.25; ring2.rotation.y = Math.cos(t*.42)*.22;
  points.rotation.y += .00035;
  points.rotation.x = py*.015;

  camera.position.x += ((px*.22)-camera.position.x)*.02;
  camera.position.y += ((-py*.14)-camera.position.y)*.02;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

function resize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);
</script>
</body>
</html>
